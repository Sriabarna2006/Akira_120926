<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="akira-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background Container -->
  <rect width="32" height="32" rx="8" fill="#0B0F17" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="url(#akira-grad)" stroke-opacity="0.4" fill="none" />
  
  <!-- AKIRA 4-point Diamond Star & Sparkle -->
  <path d="M16 4C16 10.5 10.5 16 4 16C10.5 16 16 21.5 16 28C16 21.5 21.5 16 28 16C21.5 16 16 10.5 16 4Z" fill="url(#akira-grad)" filter="url(#glow)" />
  
  <!-- Secondary micro-sparkle -->
  <circle cx="23" cy="9" r="1.75" fill="#38bdf8" />
  <circle cx="9" cy="23" r="1.25" fill="#818cf8" />
</svg>
